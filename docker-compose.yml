version: '3.8'

services:
  # 🔥 DragonflyDB: Pengganti Redis yang jauh lebih cepat & multi-threaded
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: always
    command: tunnel run fastapi-cctv
    volumes:
      - ./cloudflared:/etc/cloudflared
    depends_on:
      - backend
  celery_worker:
    build: .
    container_name: celery_worker
    restart: always
    depends_on:
      - dragonfly
      - db
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://user_admin:password_rahasia@db:5432/marketplace_db
      - REDIS_HOST=dragonfly
      - REDIS_PORT=6379
      - QDRANT_URL=http://qdrant:6333
    command: celery -A backend.celery_app.celery_app worker -l info -Q default,email,auth --concurrency=4
  dragonfly:
    image: 'docker.dragonflydb.io/dragonflydb/dragonfly'
    container_name: dragonfly_service
    ports:
      - "6379:6379"
    ulimits:
      memlock: -1
    restart: always
    # Batasi memori jika dijalankan di laptop (opsional)
    # command: ["--memlimit=512MB"]

  # 🐘 PostgreSQL: Database utama dengan fitur Healthcheck
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: user_admin
      POSTGRES_PASSWORD: password_rahasia
      POSTGRES_DB: marketplace_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # 🔥 Memastikan container sehat hanya jika Postgres benar-benar siap menerima koneksi
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_admin -d marketplace_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ⚡ FastAPI Backend
  backend:
    build: .
    container_name: fastapi_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy  # 🔥 Tunggu DB sampai benar-benar siap
      dragonfly:
        condition: service_started
      manticore:
        condition: service_started  # 🔥 Pastikan backend menunggu Manticore nyala
      qdrant:
        condition: service_started
    # 🔥 Membaca variabel dari backend/.env
    env_file:
      - ./backend/.env
    # 🔥 Sinkronisasi file untuk Auto-Update (Hot Reload)
    volumes:
      - ./backend:/app/backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://user_admin:password_rahasia@db:5432/marketplace_db
      - REDIS_HOST=dragonfly
      - REDIS_PORT=6379
      - MANTICORE_URL=http://manticore:9308
      - QDRANT_URL=http://qdrant:6333
    ports:
      - "8000:8000"
    # 🔥 Mode Development dengan auto-reload
    command: uvicorn backend:app --host 0.0.0.0 --port 8000 --reload

  # ⚡ Manticore Search: Pengganti Elasticsearch yang sangat ringan & cepat
  manticore:
    image: manticoresearch/manticore:6.3.0
    container_name: manticore_db
    ports:
      - "9306:9306"
      - "9308:9308"
    volumes:
      - manticore_data:/var/lib/manticore
    restart: always

  # ⚡ Qdrant: Vector Database untuk semantic search
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: qdrant_db
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always
    
volumes:
  postgres_data:
  manticore_data:
  qdrant_data: