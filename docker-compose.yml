services:
  # 🌐 Cloudflare Tunnel (Opsional untuk expose public)
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: always
    command: tunnel run fastapi-cctv
    volumes:
      - ./cloudflared:/etc/cloudflared
    depends_on:
      - backend

  # ⚙️ Celery Background Worker
  celery_worker:
    build: .
    container_name: celery_worker
    restart: always
    depends_on:
      dragonfly:
        condition: service_started
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://user_admin:password_rahasia@db:5432/marketplace_db
      - REDIS_HOST=dragonfly
      - REDIS_PORT=6379
      - MANTICORE_URL=http://manticore:9308
    volumes:
      - ./backend:/app/backend
    command: celery -A backend.celery_app.celery_app worker -l info -Q default,email,auth --concurrency=2

  # 🔥 DragonflyDB: Pengganti Redis yang ultra-cepat, multi-threaded, & hemat RAM
  dragonfly:
    image: 'docker.dragonflydb.io/dragonflydb/dragonfly'
    container_name: dragonfly_service
    ports:
      - "6379:6379"
    ulimits:
      memlock: -1
    restart: always
    command: ["--proactor_threads=2", "--maxmemory=512MB", "--cache_mode=true"]

  # 🐘 PostgreSQL: Database utama dengan Healthcheck
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: user_admin
      POSTGRES_PASSWORD: password_rahasia
      POSTGRES_DB: marketplace_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_admin -d marketplace_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ⚡ FastAPI Backend
  backend:
    build: .
    container_name: fastapi_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      dragonfly:
        condition: service_started
      manticore:
        condition: service_started
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app/backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://user_admin:password_rahasia@db:5432/marketplace_db
      - REDIS_HOST=dragonfly
      - REDIS_PORT=6379
      - MANTICORE_URL=http://manticore:9308
    ports:
      - "8000:8000"
    command: uvicorn backend:app --host 0.0.0.0 --port 8000 --reload

  # ⚡ Manticore Search: Search Engine ultra-cepat & hemat RAM (~30-50MB) pengganti Elasticsearch & Qdrant
  manticore:
    image: manticoresearch/manticore:6.3.0
    container_name: manticore_db
    environment:
      - EXTRA=0
    ports:
      - "9306:9306"
      - "9308:9308"
    volumes:
      - manticore_data:/var/lib/manticore
    restart: always
    healthcheck:
      test: ["CMD", "mysql", "-h", "127.0.0.1", "-P", "9306", "-e", "SHOW STATUS"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
  manticore_data: